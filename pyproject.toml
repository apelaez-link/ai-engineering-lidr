[project]
name = "proyecto-1-estimador"
version = "0.2.0"
description = "Proyecto 1 (estimador de software CAG) del curso AI Engineering LIDR. Wrapper de proveedores (abstracción + fallback), cacheo, streaming y observabilidad. Evoluciona sesión a sesión."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Abstracción de proveedores (lección "Abstracción de proveedores y fallback").
    # OJO seguridad de dependencias: las versiones 1.82.7 y 1.82.8 de LiteLLM fueron
    # comprometidas en marzo de 2026; las excluimos explícitamente. Buena práctica:
    # fijar/pinar versiones de cualquier dependencia.
    "litellm>=1.74,!=1.82.7,!=1.82.8",
    # SDKs (LiteLLM los usa por debajo; se dejan explícitos como referencia).
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    # Observabilidad (lección "Observabilidad, logging y trazabilidad").
    "structlog>=24.4.0",
    # Cacheo opcional con Redis (lección "Cacheo inteligente"). El backend por
    # defecto es en memoria, así que Redis solo hace falta si CACHE_BACKEND=redis.
    "redis>=5.2.0",
    # Interfaz conversacional (ejercicio entregable + lección "Interfaces conversacionales").
    "streamlit>=1.40.0",
    # Templates Jinja2 versionados para los prompts (sesión 04).
    "jinja2>=3.1.0",
    # Cliente HTTP para el Streamlit de sesión 04 (llama a la API en lugar de importar el código).
    "httpx>=0.27.0",
    # Salida JSON estructurada (sesión 04, lección "Extracción de datos estructurados").
    # Instructor envuelve litellm y fuerza al LLM a devolver un objeto Pydantic
    # validado (con reintentos automáticos si la validación falla).
    "instructor>=1.5.0",
    # Cacheo semántico (sesión 04, lección "Cacheo semántico de respuestas").
    # numpy se usa para la similitud coseno entre embeddings.
    "numpy>=1.26.0",
    # Adjuntos (sesión 05, CAMINO B: extracción LOCAL de texto). pypdf parsea PDFs
    # y python-docx parsea Word, sin enviar el binario a ningún servicio externo.
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Multipart para el endpoint conversacional con adjuntos (UploadFile/Form).
    "python-multipart>=0.0.9",
    # Generador de PDFs sintéticos para el stress test (sesión 06). fpdf2 produce
    # PDFs deterministas en memoria (Lorem Ipsum repetido) para medir cómo afecta
    # el tamaño del contexto enriquecido a latencia/tokens/coste. Solo lo usa el
    # script evals/stress/fixtures/build_pdfs.py (no entra en el camino de producción).
    "fpdf2>=2.7.0",
    # Pipeline de embeddings (sesión 07). tiktoken cuenta tokens del texto de cada
    # chunk con el tokenizador exacto de text-embedding-3-small (para detectar chunks
    # grandes y estimar coste). openai (ya arriba) genera los embeddings. NO añadimos
    # numpy/scikit-learn por el ejercicio: la similitud coseno se calcula a mano en
    # embedding_pipeline/similarity.py (numpy ya estaba por el cacheo semántico de S04).
    "tiktoken>=0.7.0",
    # Persistencia vectorial (sesión 08): PostgreSQL + pgvector.
    #   sqlalchemy 2.0  -> ORM async (Document/Chunk) y construcción de queries.
    #   asyncpg         -> driver async oficial recomendado por SQLAlchemy para Postgres.
    #   pgvector        -> registra el tipo `vector` en SQLAlchemy y expone los
    #                      operadores de distancia (cosine_distance, l2_distance...).
    #   alembic         -> migraciones del esquema (extensión + tablas documents/chunks).
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # Redis en memoria para tests: prueba el backend de caché sin un Redis real.
    "fakeredis>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# pythonpath="." permite importar `app` sin instalar el paquete.
# testpaths limita el descubrimiento de tests a la carpeta tests/.
pythonpath = ["."]
testpaths = ["tests"]
